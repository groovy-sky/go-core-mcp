name: Build and publish Phi-4-mini-instruct image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - cmd/**
      - docker/**
      - coreutils/**
      - internal/**
      - go.mod
      - .github/workflows/publish-phi4-mini.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/groovy-agent
  IMAGE_TAG: phi4-mini

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,format=long,prefix=${{ env.IMAGE_TAG }}-
            type=raw,value=${{ env.IMAGE_TAG }}-run-${{ github.run_number }}

      - name: Build and push image with Phi-4-mini-instruct.Q8_0
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DOWNLOAD_MODEL=1
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
