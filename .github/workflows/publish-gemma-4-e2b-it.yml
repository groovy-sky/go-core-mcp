name: Build and publish Gemma 4 E2B IT image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - cmd/**
      - docker/**
      - coreutils/**
      - internal/**
      - go.mod
      - .github/workflows/publish-gemma-4-e2b-it.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/groovy-agent
  IMAGE_TAG: gemma-4-e2b-it

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with gemma-4-E2B-it-Q4_K_M
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            DOWNLOAD_MODEL=1
            MODEL_URL=https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf
            MODEL_FILENAME=gemma-4-E2B-it-Q4_K_M.gguf
            MODEL_NAME=gemma-4-E2B-it
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
